[package]
name = "vibe-iptv"
version = "0.1.0"
description = "VIBE IPTV — reproductor de escritorio para proveedores IPTV del usuario"
edition = "2021"
rust-version = "1.82"

# Biblioteca además de ejecutable: iOS no arranca un `main`, enlaza el núcleo como
# biblioteca estática (F15). `rlib` es la que usan el ejecutable y los tests. Sin
# `cdylib` (la plantilla de Tauri la trae para Android): en iOS no se podría enlazar
# suelta, porque `vibe_player_present` está en el Swift de la propia app.
[lib]
name = "vibe_iptv_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "process", "time", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.7"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Cada almacén solo se activa en su sistema: el Administrador de credenciales en
# Windows, el llavero en iPhone y iPad (F15).
keyring = { version = "3", features = ["windows-native", "apple-native"] }
ts-rs = "10"
tower-http = { version = "0.6", features = ["cors", "fs"] }
async-trait = "0.1"
regex = "1"
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
quick-xml = "0.36"
flate2 = "1"
sha2 = "0.10"
rand = "0.10"

# Que ffmpeg y mpv mueran con la app aunque se cierre de golpe (`util::child_processes`).
# Ya venía con Tauri: no añade nada que descargar ni compilar de nuevo.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
